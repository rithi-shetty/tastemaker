[project]
name = "tastemaker"
version = "1.0.0"
description = "A discovery feed that learns what each user likes without wearing them out: simulator, bandit policies and experiments."
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "scipy>=1.10", "matplotlib>=3.7"]

[project.optional-dependencies]
dev = ["pytest>=7"]

[tool.setuptools]
packages = ["tastemaker"]

[tool.pytest.ini_options]
testpaths = ["tests"]
